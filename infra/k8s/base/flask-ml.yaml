apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-ml
  labels:
    app: flask-ml
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-ml
  template:
    metadata:
      labels:
        app: flask-ml
    spec:
      containers:
        - name: flask-ml
          image: flask-ml:ci
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
          env:
            - name: INTERNAL_API_TOKEN
              value: ci-internal-token
            - name: SECRET_KEY
              value: ci-jwt-secret-not-for-production-use
            - name: JWT_SECRET
              value: ci-jwt-secret-not-for-production-use
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: DB_SSLMODE
              value: disable
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: flask-ml
spec:
  type: NodePort
  selector:
    app: flask-ml
  ports:
    - port: 5001
      targetPort: 5001
      nodePort: 30001
