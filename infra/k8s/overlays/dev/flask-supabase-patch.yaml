apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-ml
spec:
  template:
    spec:
      containers:
        - name: flask-ml
          envFrom:
            - secretRef:
                name: supabase-db
          env:
            - name: INTERNAL_API_TOKEN
              value: dev-internal-token
            - name: SECRET_KEY
              value: your-jwt-secret-change-in-production
            - name: JWT_SECRET
              value: your-jwt-secret-change-in-production
            - name: REDIS_HOST
              value: redis
