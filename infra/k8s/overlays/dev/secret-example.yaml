# Example only — copy to a local secret or use sealed-secrets. Do not commit real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: supabase-db
type: Opaque
stringData:
  SPRING_DATASOURCE_URL: jdbc:postgresql://YOUR_HOST:5432/postgres?sslmode=require
  SPRING_DATASOURCE_USERNAME: postgres
  SPRING_DATASOURCE_PASSWORD: replace-me
  DB_HOST: YOUR_HOST
  DB_USER: postgres
  DB_PASSWORD: replace-me
  DB_NAME: postgres
  DB_PORT: "5432"
  DB_SSLMODE: require
