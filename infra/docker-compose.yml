# Docker Compose file - version field is obsolete in newer versions
# Note: .env file should be in parent directory (../.env)
# Use: docker compose --env-file ../.env up
# Or run from root: make up

networks:
  app-net:
    driver: bridge

volumes:
  redis_data:

services:
  # Note: Using Supabase PostgreSQL (external), not local container
  # If you want to use a local PostgreSQL container instead, uncomment the postgres service above
  # and update backend-api and flask-ml to use 'postgres' as DB_HOST

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [app-net]

  backend-api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://${DB_HOST:-aws-1-us-east-1.pooler.supabase.com}:5432/${DB_NAME:-postgres}?sslmode=require}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-${DB_USER:-postgres.brettblayvzvgswearre}}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-${DB_PASSWORD}}
      FLASK_API_URL: http://flask-ml:5001
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token}
      SPRING_PROFILES_ACTIVE: docker
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [app-net]

  flask-ml:
    build:
      context: ../flask-api
      dockerfile: Dockerfile
    environment:
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token}
      DB_HOST: ${DB_HOST:-aws-1-us-east-1.pooler.supabase.com}
      DB_USER: ${DB_USER:-postgres.brettblayvzvgswearre}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "5001:5001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [app-net]

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    environment:
      - REACT_APP_API_BASE_URL=http://localhost:8081
    ports:
      - "3000:80"
    depends_on:
      - backend-api
    networks: [app-net]

