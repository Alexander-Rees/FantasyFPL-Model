spring.application.name=demo

# Database Configuration - PostgreSQL (Supabase)
# Use env vars if available, fallback to defaults for local dev
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fantasy_soccer}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Configuration (Connection Pool)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.initialization-fail-timeout=60000

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# PostgreSQL Configuration
spring.datasource.hikari.data-source-properties.preparedStatementCacheQueries=250
spring.datasource.hikari.data-source-properties.preparedStatementCacheSizeMiB=5
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
spring.datasource.hikari.data-source-properties.useServerPrepStmts=true
spring.datasource.hikari.data-source-properties.rewriteBatchedStatements=true

# Logging (Optional)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework=DEBUG
logging.level.com.example.demo=DEBUG

# Change Spring Boot server port
server.port=8081

# Flask API Configuration
flask.api.url=http://localhost:5001
internal.api.token=${INTERNAL_API_TOKEN:dev-internal-token}

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.repair-on-migrate=true
spring.flyway.clean-on-validation-error=false

# Validation & API versioning metadata (for OpenAPI grouping if needed)
api.version=v1

# Redis Configuration (optional - only used if Redis is available)
# Uncomment these if you have Redis running, otherwise caching will use simple cache
# spring.data.redis.host=${REDIS_HOST:localhost}
# spring.data.redis.port=${REDIS_PORT:6379}
# spring.data.redis.password=${REDIS_PASSWORD:}

# Cache Configuration (falls back to simple cache if Redis unavailable)
spring.cache.type=simple
spring.cache.cache-names=players,player,optimization

# Actuator Configuration
management.endpoints.web.exposure.include=health,metrics,prometheus,info
management.endpoint.health.probes.enabled=true
management.metrics.export.prometheus.enabled=true
