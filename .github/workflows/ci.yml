name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit_backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Run backend unit tests
        working-directory: backend
        run: ./mvnw test -q

  unit_flask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: flask-api/requirements.txt

      - name: Install dependencies
        working-directory: flask-api
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run Flask unit tests
        working-directory: flask-api
        run: pytest --maxfail=1 -q
        env:
          INTERNAL_API_TOKEN: test-internal-token
          DB_SSLMODE: disable

  unit_frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test -- --watchAll=false
        env:
          CI: true

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  build_images:
    runs-on: ubuntu-latest
    needs: [unit_backend, unit_flask, unit_frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        working-directory: backend
        run: docker build -t backend-api:ci -f Dockerfile .

      - name: Build flask image
        working-directory: flask-api
        run: docker build -t flask-ml:ci -f Dockerfile .

      - name: Save images
        run: |
          docker save backend-api:ci | gzip > /tmp/backend-api-ci.tar.gz
          docker save flask-ml:ci | gzip > /tmp/flask-ml-ci.tar.gz

      - name: Upload image artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ci-images
          path: |
            /tmp/backend-api-ci.tar.gz
            /tmp/flask-ml-ci.tar.gz
          retention-days: 1

  integration_kind:
    runs-on: ubuntu-latest
    needs: [build_images]
    steps:
      - uses: actions/checkout@v4

      - name: Download image artifacts
        uses: actions/download-artifact@v4
        with:
          name: ci-images
          path: /tmp/images

      - name: Load Docker images
        run: |
          gunzip -c /tmp/images/backend-api-ci.tar.gz | docker load
          gunzip -c /tmp/images/flask-ml-ci.tar.gz | docker load

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0

      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: fpl-ci
          config: infra/k8s/kind.yaml
          wait: 120s

      - name: Load images into kind
        run: |
          kind load docker-image backend-api:ci --name fpl-ci
          kind load docker-image flask-ml:ci --name fpl-ci

      - name: Apply CI overlay
        run: kubectl apply -k infra/k8s/overlays/ci

      - name: Wait for rollouts
        run: |
          kubectl -n fpl rollout status deploy/postgres --timeout=120s
          kubectl -n fpl rollout status deploy/redis --timeout=120s
          kubectl -n fpl rollout status deploy/flask-ml --timeout=180s
          kubectl -n fpl rollout status deploy/backend-api --timeout=300s

      - name: Run integration smoke checks
        env:
          BACKEND_URL: http://localhost:8081
          FLASK_URL: http://localhost:5001
          INTERNAL_API_TOKEN: ci-internal-token
          KEEP_CLUSTER: "1"
        run: |
          # Cluster already exists; skip create/build by invoking smoke section via script with images loaded.
          # Use the shared script but skip cluster create by setting SKIP_KIND_BOOTSTRAP.
          SKIP_KIND_BOOTSTRAP=1 ./scripts/test-integration-kind.sh
