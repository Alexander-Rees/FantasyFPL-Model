name: Weekly FPL Update

on:
  schedule:
    # Run every Wednesday at 2 AM UTC (Tuesday evening in US timezones)
    - cron: '0 2 * * 3'
  workflow_dispatch: # Allow manual triggering

jobs:
  weekly-update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            flask-api/requirements.txt
            llm-service/requirements-docker.txt
      
      - name: Verify database secrets
        run: |
          if [ -z "${{ secrets.DB_HOST }}" ]; then
            echo "❌ Error: DB_HOST secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.DB_PASSWORD }}" ]; then
            echo "❌ Error: DB_PASSWORD secret is not set"
            exit 1
          fi
          echo "✅ Database secrets are configured"
      
      - name: Install Flask API dependencies
        working-directory: flask-api
        run: |
          pip install -r requirements.txt
      
      - name: Install LLM Service dependencies
        working-directory: llm-service
        run: |
          pip install -r requirements-docker.txt
      
      - name: Step 1: Ingest FPL player data
        working-directory: flask-api
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER || 'postgres' }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME || 'postgres' }}
          DB_PORT: ${{ secrets.DB_PORT || '5432' }}
        run: |
          echo "📊 Step 1/4: Ingesting FPL player data..."
          python scripts/ingest_elo_and_fpl.py
          echo "✅ FPL data ingestion complete"
      
      - name: Step 2: Retrain ML model
        working-directory: flask-api
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER || 'postgres' }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME || 'postgres' }}
          DB_PORT: ${{ secrets.DB_PORT || '5432' }}
        run: |
          echo "🤖 Step 2/4: Retraining ML model..."
          python train_model.py
          echo "✅ ML model retraining complete"
      
      - name: Step 3: Scrape latest FPL articles
        working-directory: llm-service/scraper
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER || 'postgres' }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME || 'postgres' }}
          DB_PORT: ${{ secrets.DB_PORT || '5432' }}
        run: |
          echo "📰 Step 3/4: Scraping latest FPL articles..."
          python weekly_scraper.py --max-articles 20
          echo "✅ Article scraping complete"
      
      - name: Step 4: Update vector database
        working-directory: llm-service
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER || 'postgres' }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME || 'postgres' }}
          DB_PORT: ${{ secrets.DB_PORT || '5432' }}
        run: |
          echo "🔍 Step 4/4: Updating vector database..."
          python tests/test_ingestion.py
          echo "✅ Vector database update complete"
      
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Weekly FPL Update Failed',
                body: 'The scheduled weekly FPL update (ML predictions + RAG articles) failed. Please check the workflow logs.'
              });
            } catch (error) {
              console.log('Failed to create issue notification:', error.message);
            }
      
      - name: Summary
        if: success()
        run: |
          echo "=================================="
          echo "✅ Weekly update complete!"
          echo ""
          echo "📊 Summary:"
          echo "  - FPL player data: Updated"
          echo "  - ML predictions: Retrained"
          echo "  - Expert articles: Scraped"
          echo "  - RAG system: Updated"

